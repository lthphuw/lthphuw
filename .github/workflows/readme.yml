name: readme

on:
  push:
    branches: [main]
    # The refresh commits README.md and assets with a PAT, which fires this
    # trigger again; ignoring what it writes stops that second, empty run.
    paths-ignore:
      - README.md
      - assets/**
  schedule:
    # 06:00 in Vietnam (UTC+7) is 23:00 UTC the day before. GitHub starts
    # scheduled runs late, sometimes by hours.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs at once would race to push the same files.
concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # A PAT is used for both checkout and push so the resulting commit counts
      # as repository activity. Commits made with GITHUB_TOKEN do not, and
      # GitHub disables scheduled workflows after 60 days without activity.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - run: python3 .github/render.py
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || {
            git commit -m "chore: refresh open source"
            # A push to main while this job ran moves it on; rebase onto that
            # rather than fail until the next run.
            git pull --rebase
            git push
          }
